<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="theme-color" content="#0B7A4B">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>سوبرماركت البيدر</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700&family=Reem+Kufi:wght@500;700&family=Lalezar&display=swap">
<style>
:root{
  /* Layout: the walkable store fills the phone screen; a light header floats on top, a cart pill at the bottom, sheets rise from below. */
  --bg:#F2F3F0;
  --surface:#FFFFFF;
  --ink:#17201B;
  --ink-2:#5B6660;
  --line:#E2E5E0;
  --brand:#0B7A4B;
  --brand-soft:#E7F2EC;
  --sale:#D22F2F;
  --promo:#FFE14D;
  --ui:"Rubik",system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;
  color-scheme:light;
}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--ui);overflow:hidden;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
input,textarea,select{-webkit-user-select:text;user-select:text}
button,input,select,textarea{font-family:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
svg.i{width:20px;height:20px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#app{position:fixed;inset:0;direction:rtl;overflow:hidden}
#gl{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
.vignette{position:absolute;inset:0;z-index:1;pointer-events:none;background:radial-gradient(ellipse 85% 75% at 50% 48%,rgba(0,0,0,0) 55%,rgba(20,16,10,.32) 100%)}

/* header */
.top{position:absolute;top:0;left:0;right:0;z-index:10;pointer-events:none;
  padding-top:calc(env(safe-area-inset-top,0px) + 8px);
  padding-left:max(10px,env(safe-area-inset-left,0px));padding-right:max(10px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:8px}
.top>*{pointer-events:auto}
.top-row{display:flex;align-items:center;gap:6px}
.brand{flex:1;min-width:0;display:flex;align-items:center;gap:10px;background:var(--surface);border:0;border-radius:16px;padding:7px 10px 7px 12px;text-align:right;box-shadow:0 2px 14px rgba(23,32,27,.10)}
.mark{width:36px;height:36px;border-radius:11px;background:var(--brand);display:grid;place-items:center;flex:none}
.mark svg{width:22px;height:22px;stroke:#fff;fill:none;stroke-width:1.7;stroke-linecap:round}
.bt{min-width:0;line-height:1.25}
.bt b{display:block;font-size:15px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bt small{display:block;font-size:12px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bt small u{text-decoration:none;color:var(--ink);font-weight:600}
.ibtn{width:44px;height:50px;flex:none;border:0;border-radius:16px;background:var(--surface);display:grid;place-items:center;box-shadow:0 2px 14px rgba(23,32,27,.10)}
.ibtn[aria-pressed="true"]{background:var(--ink);color:#fff}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -10px;padding:2px 10px 2px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:0;background:rgba(255,255,255,.94);border-radius:999px;padding:8px 14px;font-weight:500;font-size:13.5px;box-shadow:0 1px 8px rgba(23,32,27,.08);white-space:nowrap}
.chip.on{background:var(--ink);color:#fff}
.chip.deal{background:var(--promo);font-weight:600}
.deal-pill{align-self:flex-start;display:flex;align-items:center;gap:8px;border:0;background:rgba(255,255,255,.94);border-radius:12px;padding:6px 10px;font-size:12.5px;box-shadow:0 1px 8px rgba(23,32,27,.08);max-width:100%}
.deal-pill .dp-txt{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.deal-pill b{color:var(--sale)}
.deal-pill .t{font-weight:700;direction:ltr;color:var(--sale);flex:none}

/* bottom */
.bottom{position:absolute;left:0;right:0;bottom:0;z-index:10;pointer-events:none;
  padding-bottom:calc(env(safe-area-inset-bottom,0px) + 12px);
  padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}
.cartpill{pointer-events:auto;position:relative;overflow:hidden;width:100%;max-width:560px;margin:0 auto;display:flex;align-items:center;gap:12px;border:0;border-radius:18px;background:var(--brand);color:#fff;padding:14px 16px;font-size:15px;font-weight:600;box-shadow:0 10px 28px rgba(11,122,75,.35)}
.cp-count{min-width:28px;height:28px;border-radius:9px;background:rgba(255,255,255,.2);display:grid;place-items:center;font-size:14px;padding:0 6px}
.cp-mid{flex:1;text-align:right;line-height:1.25}
.cp-mid small{display:block;font-size:11.5px;font-weight:400;opacity:.85}
.cp-total{font-size:16px;font-weight:700}
.cp-prog{position:absolute;left:0;right:0;bottom:0;height:3px;background:rgba(255,255,255,.18)}
.cp-prog b{display:block;height:100%;width:0;background:var(--promo);transition:width .5s cubic-bezier(.2,.8,.2,1)}
.bump{animation:bump .4s cubic-bezier(.2,.8,.2,1)}
@keyframes bump{35%{transform:scale(1.03)}}

/* floating thumb stick */
.joy{position:absolute;z-index:9;width:124px;height:124px;margin:-62px 0 0 -62px;border-radius:50%;pointer-events:none;
  background:radial-gradient(circle,rgba(255,255,255,.28),rgba(255,255,255,.12));border:1.5px solid rgba(255,255,255,.7);box-shadow:0 4px 20px rgba(0,0,0,.12);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
.joy i{position:absolute;left:50%;top:50%;width:54px;height:54px;margin:-27px 0 0 -27px;border-radius:50%;background:rgba(255,255,255,.95);box-shadow:0 4px 14px rgba(0,0,0,.22)}

.toast{position:absolute;z-index:60;left:50%;bottom:100px;transform:translate(-50%,8px);opacity:0;pointer-events:none;background:rgba(23,32,27,.92);color:#fff;border-radius:12px;padding:10px 14px;font-size:13.5px;transition:opacity .2s,transform .2s;max-width:calc(100% - 32px);text-align:center;line-height:1.45}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* loader */
.loader{position:absolute;inset:0;z-index:70;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;transition:opacity .5s}
.loader.out{opacity:0;pointer-events:none}
.loader .mark{width:64px;height:64px;border-radius:20px}
.loader .mark svg{width:38px;height:38px}
.loader b{font-size:17px}
.loader span{font-size:13px;color:var(--ink-2)}
.ld-bar{width:180px;height:4px;border-radius:9px;background:var(--line);overflow:hidden}
.ld-bar i{display:block;height:100%;width:0;background:var(--brand);transition:width .25s}

/* coach marks */
.coach{position:absolute;inset:0;z-index:50;display:flex;flex-direction:column;justify-content:flex-end;background:linear-gradient(to top,rgba(10,18,14,.72),rgba(10,18,14,.25) 60%,rgba(10,18,14,.1));
  padding:0 max(16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 20px) max(16px,env(safe-area-inset-left,0px))}
.coach-zones{position:absolute;inset:0;display:flex;pointer-events:none}
.coach-zones div{flex:1;display:flex;align-items:center;justify-content:center;color:#fff;font-size:14px;font-weight:600;text-align:center;line-height:1.5;padding:16px}
.coach-zones div+div{border-right:1.5px dashed rgba(255,255,255,.45)}
.coach-zones svg{display:block;margin:0 auto 8px;width:44px;height:44px;stroke:#fff;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.coach-card{position:relative;background:var(--surface);border-radius:20px;padding:16px;max-width:520px;width:100%;margin:0 auto}
.coach-card p{margin:0 0 12px;font-size:14px;line-height:1.65;color:var(--ink-2)}
.coach-card p b{color:var(--ink)}

/* sheets */
.backdrop{position:absolute;inset:0;z-index:40;background:rgba(10,18,14,.42);opacity:0;transition:opacity .25s}
.backdrop.open{opacity:1}
.sheet{position:absolute;left:0;right:0;bottom:0;margin:0 auto;width:min(100%,560px);z-index:41;background:var(--surface);border-radius:24px 24px 0 0;max-height:88%;overflow-y:auto;overscroll-behavior:contain;
  padding:6px max(18px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 18px) max(18px,env(safe-area-inset-left,0px));
  transform:translateY(105%);transition:transform .34s cubic-bezier(.2,.85,.25,1);box-shadow:0 -8px 40px rgba(10,18,14,.18)}
.sheet.open{transform:none}
.sheet.tall{height:88%}
.grab{width:40px;height:5px;border-radius:9px;background:var(--line);margin:6px auto 12px}
.sh-head{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.sh-head h2{font-size:19px;font-weight:700;margin:0;flex:1;line-height:1.3}
.x-btn{width:40px;height:40px;border-radius:12px;border:0;background:var(--bg);display:grid;place-items:center;flex:none}
.btn{border:0;border-radius:15px;padding:15px 16px;font-weight:600;font-size:15.5px;display:flex;align-items:center;justify-content:center;gap:8px;width:100%;text-decoration:none}
.btn-primary{background:var(--brand);color:#fff}
.btn-dark{background:var(--ink);color:#fff}
.btn-ghost{background:var(--bg);color:var(--ink)}

.p-img{position:relative;height:210px;border-radius:18px;background:radial-gradient(circle at 50% 40%,#FFFFFF,#ECEEEA);display:grid;place-items:center;overflow:hidden}
.p-img img{max-height:92%;max-width:80%;object-fit:contain}
.ph{width:60%;height:60%;border-radius:50%;background:var(--line)}
.badge{position:absolute;top:12px;right:12px;background:var(--sale);color:#fff;font-weight:600;font-size:12.5px;border-radius:8px;padding:4px 8px}
.badge.deal{background:var(--promo);color:var(--ink)}
.p-brand{font-size:12.5px;color:var(--ink-2);margin:14px 0 2px}
.p-name{font-size:21px;font-weight:700;margin:0;line-height:1.35}
.p-size{font-size:13.5px;color:var(--ink-2);margin-top:2px}
.p-price{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin:12px 0 2px}
.p-price .now{font-size:26px;font-weight:700}
.p-price s{color:var(--ink-2);font-size:15px}
.p-price .save{color:var(--sale);font-weight:600;font-size:13px}
.unit{font-size:12px;color:var(--ink-2)}
.where{display:flex;align-items:center;gap:10px;background:var(--bg);border-radius:14px;padding:11px 12px;font-size:13.5px;margin:14px 0}
.where span{flex:1;min-width:0;line-height:1.45}
.where button{border:0;background:var(--ink);color:#fff;font-weight:600;font-size:13px;border-radius:11px;padding:9px 12px;flex:none}
.p-act{display:flex;gap:10px;align-items:center}
.p-act .incart{flex:1;font-size:13.5px;color:var(--ink-2)}
.pair{margin-top:18px;padding-top:14px;border-top:1px solid var(--line)}
.pair h3{font-size:13.5px;margin:0 0 10px;font-weight:600;color:var(--ink-2)}
.row-p{display:flex;align-items:center;gap:12px}
.thumb{width:56px;height:56px;border-radius:14px;background:#F1F2EF;display:grid;place-items:center;flex:none;border:0;padding:0;overflow:hidden}
.thumb img{width:88%;height:88%;object-fit:contain}
.row-p .rt{flex:1;min-width:0;font-size:14px;font-weight:500;line-height:1.4}
.row-p .rt span{display:block;font-size:12.5px;color:var(--ink-2);font-weight:400}

.step{display:flex;align-items:center;background:var(--brand);color:#fff;border-radius:12px;flex:none}
.step button{border:0;background:transparent;color:#fff;width:38px;height:38px;font-size:21px;display:grid;place-items:center}
.step span{min-width:22px;text-align:center;font-weight:600;font-size:14.5px}
.step.lg button{width:50px;height:50px}
.step.lg span{min-width:30px;font-size:17px}
.add{border:0;background:var(--brand);color:#fff;width:38px;height:38px;border-radius:12px;font-size:22px;display:grid;place-items:center;flex:none}

.c-item{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
.c-item .rt{flex:1;min-width:0;font-size:14px;font-weight:500;line-height:1.4}
.c-item .rt span{display:block;font-size:12.5px;color:var(--ink-2);font-weight:400}
.c-item .cp{font-weight:600;font-size:14px;min-width:56px;text-align:left}
.note{display:flex;gap:10px;align-items:center;background:var(--brand-soft);color:var(--brand);border-radius:14px;padding:11px 12px;font-size:13.5px;font-weight:500;margin-bottom:6px;line-height:1.45}
.note.red{background:#FCEBEB;color:var(--sale)}
.ups{display:flex;gap:10px;overflow-x:auto;padding:2px 0 6px;scrollbar-width:none}
.ups::-webkit-scrollbar{display:none}
.up{flex:none;width:128px;border:1px solid var(--line);border-radius:16px;padding:8px;display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:500;line-height:1.35}
.up .thumb{width:100%;height:84px}
.up .uf{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-top:auto}
.up .uf .add,.up .uf .step button{width:32px;height:32px;font-size:19px}
.sec-t{font-size:14px;font-weight:600;margin:18px 0 8px}
.coupon{display:flex;gap:8px}
.coupon input{flex:1;min-width:0;border:1.5px solid var(--line);border-radius:13px;padding:12px;font-size:15px;background:var(--surface);direction:ltr;text-align:right;text-transform:uppercase}
.coupon button{border:0;border-radius:13px;background:var(--ink);color:#fff;font-weight:600;padding:0 18px}
.c-hint{font-size:12.5px;color:var(--ink-2);margin-top:6px;line-height:1.5}
.sum{margin-top:14px;background:var(--bg);border-radius:16px;padding:13px 14px;display:flex;flex-direction:column;gap:9px;font-size:14px}
.sum div{display:flex;justify-content:space-between;gap:10px}
.sum .tot{font-weight:700;font-size:16.5px;border-top:1px solid var(--line);padding-top:9px}
.sum .good{color:var(--brand);font-weight:600}
.empty{text-align:center;padding:30px 8px}
.empty .eico{width:76px;height:76px;border-radius:24px;background:var(--bg);display:grid;place-items:center;margin:0 auto 14px}
.empty .eico svg{width:36px;height:36px}
.empty h3{font-size:19px;margin:0 0 6px}
.empty p{color:var(--ink-2);font-size:14px;margin:0 0 18px;line-height:1.6}

.form{display:flex;flex-direction:column;gap:14px}
.field label{display:block;font-size:13px;font-weight:600;margin-bottom:6px}
.field input,.field select,.field textarea{width:100%;box-sizing:border-box;border:1.5px solid var(--line);border-radius:13px;padding:12px;font-size:16px;background:var(--surface)}
.field textarea{min-height:70px;resize:vertical}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--brand);outline:none}
.err{color:var(--sale);font-size:12.5px;margin-top:5px}
.opts{display:grid;gap:8px}
.opt{display:flex;align-items:center;gap:10px;border:1.5px solid var(--line);border-radius:13px;padding:12px;font-size:14px;font-weight:500;cursor:pointer}
.opt input{accent-color:var(--brand);width:19px;height:19px;margin:0}
.opt:has(input:checked){border-color:var(--brand);background:var(--brand-soft)}
.opt small{margin-inline-start:auto;color:var(--ink-2);font-weight:400}
.done{text-align:center}
.done .ok{width:72px;height:72px;border-radius:50%;background:var(--brand);color:#fff;display:grid;place-items:center;margin:6px auto 12px}
.done .ok svg{width:34px;height:34px;stroke-width:2.6}
.done h2{font-size:21px;margin:0}
.order-no{display:inline-block;margin:8px 0 12px;font-weight:600;background:var(--bg);border-radius:10px;padding:6px 12px;direction:ltr}
.receipt{text-align:right;background:var(--bg);border-radius:14px;padding:12px 14px;font-size:12.5px;line-height:1.75;white-space:pre-wrap;max-height:190px;overflow:auto;margin-bottom:12px;-webkit-user-select:text;user-select:text}
.wa-row{display:flex;flex-direction:column;gap:8px}
.fine{font-size:12.5px;color:var(--ink-2);margin-top:10px;line-height:1.65}

/* list view */
.list{position:absolute;inset:0;z-index:5;background:var(--bg);overflow-y:auto;overscroll-behavior:contain;
  padding-top:calc(var(--top-h,130px) + 6px);padding-bottom:calc(var(--bot-h,90px) + 24px);
  padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}
.list-in{max-width:980px;margin:0 auto}
.search{display:flex;align-items:center;gap:8px;background:var(--surface);border-radius:15px;padding:2px 14px;border:1.5px solid var(--line)}
.search input{flex:1;min-width:0;border:0;outline:none;padding:12px 0;font-size:16px;background:transparent}
.reorder{margin-top:12px;display:flex;align-items:center;gap:12px;background:var(--surface);border-radius:16px;padding:12px 14px;border:1px solid var(--line)}
.reorder .rt{flex:1;min-width:0;font-size:13px;line-height:1.5;color:var(--ink-2)}
.reorder .rt b{display:block;font-size:15px;color:var(--ink)}
.reorder button{border:0;background:var(--ink);color:#fff;font-weight:600;border-radius:12px;padding:10px 12px;flex:none}
.l-sec{margin-top:22px;scroll-margin-top:calc(var(--top-h,130px) + 10px)}
.l-sec h3{font-size:18px;font-weight:700;margin:0 0 10px;display:flex;align-items:center;gap:8px}
.l-sec h3 small{margin-inline-start:auto;font-size:12.5px;font-weight:500}
.l-sec h3 small button{border:0;background:none;color:var(--brand);font-weight:600;font-size:13px;padding:4px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:10px}
.pc{background:var(--surface);border-radius:18px;overflow:hidden;display:flex;flex-direction:column}
.pc-img{position:relative;height:124px;background:radial-gradient(circle at 50% 40%,#FFFFFF,#EEF0EC);display:grid;place-items:center;border:0;width:100%;padding:0}
.pc-img img{max-height:86%;max-width:76%;object-fit:contain}
.pc-img .badge{top:8px;right:8px;font-size:11.5px;padding:3px 7px}
.pc-b{padding:9px 11px 11px;display:flex;flex-direction:column;gap:2px;flex:1}
.pc-b h4{margin:0;font-size:14px;line-height:1.4;font-weight:500}
.pc-b .sz{font-size:12px;color:var(--ink-2)}
.pc-f{display:flex;align-items:center;gap:6px;margin-top:auto;padding-top:9px}
.pc-f .pp{flex:1;min-width:0;line-height:1.2}
.pc-f .pp b{font-size:16px;font-weight:700;display:block}
.pc-f .pp s{font-size:12px;color:var(--ink-2)}
.pc-f .step button{width:32px;height:34px;font-size:19px}
.pc-f .step span{min-width:18px;font-size:13.5px}
.pc-f .add{width:36px;height:36px}
.no-res{text-align:center;color:var(--ink-2);padding:40px 0}

/* info sheet */
.info p{font-size:14.5px;line-height:1.8;margin:0 0 12px}
.info h3{font-size:15.5px;margin:20px 0 8px}
.facts{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.facts div{background:var(--bg);border-radius:13px;padding:11px 12px;font-size:13px;line-height:1.55;color:var(--ink-2)}
.facts b{display:block;font-size:14px;color:var(--ink);margin-bottom:2px}
.steps{list-style:none;counter-reset:s;padding:0;margin:0;display:flex;flex-direction:column;gap:9px}
.steps li{counter-increment:s;display:flex;gap:10px;font-size:14px;line-height:1.6}
.steps li::before{content:counter(s);width:26px;height:26px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;font-weight:600;font-size:13px;flex:none}
.plans{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.plan{border:1.5px solid var(--line);border-radius:16px;padding:14px}
.plan.hot{border-color:var(--brand);background:var(--brand-soft)}
.plan h4{margin:0;font-size:14.5px}
.plan .pr{font-size:24px;font-weight:700;margin:6px 0 2px}
.plan ul{margin:8px 0 0;padding-inline-start:18px;font-size:13px;line-height:1.75}
.contact{display:flex;align-items:center;gap:10px;background:var(--ink);color:#fff;border-radius:15px;padding:12px 14px;margin-top:14px;font-size:14px}
.contact b{direction:ltr;display:inline-block}

  const delivery = !count || after >= STORE.freeDelivery ? 0 : STORE.deliveryFee;
  return { sub, saved: saved + disc, disc, delivery, total: after + delivery, count, after, left: Math.max(0, STORE.freeDelivery - after) };
}

const INST = {};
const TAGS = [];
const TAG_MAT = {};
function fillFace(f){
  const rot = Math.atan2(f.normal.x, f.normal.z);
  const list = f.list.map(id => byId[id]);
  f.shelves.forEach((y, si) => {
    const gap = (si < f.shelves.length - 1 ? f.shelves[si + 1] : f.top) - y - .03;
    let s = .05, k = si * 2 + (f.seed || 0), bi = 0, tries = 0;
    while (s < f.len - .1 && tries < list.length * 3){
      const p = list[k % list.length]; k++;
      const [w, h, d] = itemDims(p);
      if (h > gap){ tries++; continue; }
      tries = 0;
      const nv = p.vars ? p.vars.length : 1, vi = (si + bi) % nv; bi++;
      const pitch = w + .01;
      let n = Math.max(2, Math.round((.42 + rnd() * .5) / pitch));
      if (f.endcap) n = Math.floor((f.len - .1) / pitch);
      n = Math.min(n, 14);
      const room = f.len - .05 - s;
      if (n * pitch > room) n = Math.floor(room / pitch);
      if (n < 1) break;
      const rows = Math.max(1, Math.min(2, Math.floor((f.depth - .02) / (d + .008))));
      const maxStack = Math.floor(gap / (h + .003));
      const stack = h < .1 ? Math.min(maxStack, h < .06 ? 4 : 2) : (maxStack >= 2 && h < .16 ? 2 : 1);
      const arr = (INST[p.id + '|' + vi] ||= []);
      for (let i = 0; i < n; i++) for (let r = 0; r < rows; r++){
        if (r === 0 && rnd() < .05 && n > 3) continue; // a missing facing, like a real shelf mid-day
        for (let st = 0; st < stack; st++){
          const along = s + pitch * (i + .5) + (rnd() - .5) * .006;
          const inward = .02 + d / 2 + r * (d + .008) + (r === 0 ? rnd() * .025 : 0);
          const pos = f.o.clone().addScaledVector(f.along, along).addScaledVector(f.normal, -inward);
          pos.y = y + st * (h + .003);
          arr.push({ pos, rot: rot + (rnd() - .5) * .07 });
        }
      }
      const bw = n * pitch, center = f.o.clone().addScaledVector(f.along, s + bw / 2);
      TAGS.push({ p, pos: center.clone().addScaledVector(f.normal, .012), y: y - .03, rot });
      const blk = { pos: center.clone().addScaledVector(f.normal, -d / 2), y, h: h * stack, w: bw, normal: f.normal.clone(), shelf: si, nShelves: f.shelves.length, where: f.where };
      blk.pos.y = y + Math.min(h * stack, .3) / 2;
      (blocks[p.id] ||= []).push(blk);
      s += bw + .025;
    }
  });
}

const me = { pos: new THREE.Vector3(-.6, 0, -.4), vel: new THREE.Vector3(), yaw: 0, pitch: -.06, tYaw: 0, tPitch: -.06, bob: 0 };

function blockedStatic(x, z, r){

}

}
function zoneOf(p){

}

  const idx = [0, 1, 2];
  if (a.t === 'front'){

    if (b.t === 'back') idx.forEach(j => cands.push([F(j), B(j), to]));
  } else if (a.t === 'back'){
    if (b.t === 'aisle') cands.push([B(b.i), to]);
    if (b.t === 'front') idx.forEach(j => cands.push([B(j), F(j), to]));
  } else {
    if (b.t === 'front') cands.push([F(a.i), to]);
    else if (b.t === 'back') cands.push([B(a.i), to]);

}

function bindControls(cv){

  const knob = $('#joyKnob'), base = $('#joy');
  cv.addEventListener('pointerdown', e => {
    if (e.pointerType === 'mouse' && e.button !== 0) return;
    try { cv.setPointerCapture(e.pointerId); } catch(err){}
    const leftZone = e.pointerType !== 'mouse' && e.clientX < innerWidth * .45 && e.clientY > topLimit() + 10;
    if (leftZone && !joy.on){
      Object.assign(joy, { on: true, id: e.pointerId, cx: e.clientX, cy: e.clientY, x: 0, y: 0, t: performance.now(), moved: false });
      base.style.left = e.clientX + 'px'; base.style.top = e.clientY + 'px'; knob.style.transform = ''; base.hidden = false;
      path = null; hideCoach();

    }
    looks.set(e.pointerId, { x: e.clientX, y: e.clientY, lx: e.clientX, ly: e.clientY, t: performance.now(), moved: false });
  });

      joy.x = dx / R; joy.y = dy / R;

    }

    if (!l.moved && Math.hypot(e.clientX - l.x, e.clientY - l.y) > 8){ l.moved = true; hideCoach(); }
    if (l.moved){
      const k = (e.pointerType === 'mouse' ? .0042 : .0058) * (camera.fov / 70);
      me.tYaw += (e.clientX - l.lx) * k;
      me.tPitch = Math.max(-.7, Math.min(.55, me.tPitch + (e.clientY - l.ly) * k * .8));

  };

  addEventListener('blur', () => { for (const k in keys) keys[k] = false; });
}
const ray = new THREE.Raycaster(), ndc = new THREE.Vector2();
function tapAt(cx, cy){
  hideCoach();

  ndc.set((cx - r.left) / r.width * 2 - 1, -(cy - r.top) / r.height * 2 + 1);
  ray.setFromCamera(ndc, camera);
  const hits = ray.intersectObjects(pickables.concat(floorMesh), false);
  const h = hits[0]; if (!h) return;
  if (h.object === floorMesh){
    if (h.distance > 26) return;
    const t = safeSpot(h.point);

// fetch with the short relative path ourselves, then let the loader parse the bytes
async function loadAsset(L, base){
  for (const ext of ['.glb', '.json']){
    try {

      if (!r.ok) continue;
      const buf = await r.arrayBuffer();
      if (buf.byteLength < 16) continue;

async function loadRigs(){

    Promise.all(CHAR.map(c => loadAsset(L, `models/${c.id}`).then(g => ({ ...c, scene: g.scene })))),
    Promise.all(ANIMS.map(n => loadAsset(L, `anims/${n}`).then(g => [n, g.animations[0]])))

/* shoppers */
function spawnShopper(atDoor){
  const pool = RIGS.chars.filter(c => !c.worker);
  const c = pool[Math.floor(rnd() * pool.length)];
  const p = makePerson(c);
  p.role = 'shopper'; p.browses = 2 + Math.floor(rnd() * 3);
  if (rnd() < .4){ p.cartObj = makeCart(); p.cartObj.position.set(0, 0, .6); p.g.add(p.cartObj); }
  p.speed = (p.cartObj ? .8 : c.f ? 1.0 : 1.15) * (.9 + rnd() * .2);
  p.pos.copy(atDoor ? new THREE.Vector3(-1.2 + rnd() * 2, 0, 5.1) : randomSpot());
  p.g.position.copy(p.pos); p.g.rotation.y = atDoor ? Math.PI : rnd() * Math.PI * 2;
  NPCS.push(p);
  if (atDoor) goTo(p, randomSpot()); else { p.timer = 1 + rnd() * 4; play(p, p.cartObj ? 'idle' : pick(['idle', 'look'])); }
  return p;
}
function goTo(p, target, then){ p.path = plan(p.pos, target); p.then = then || null; p.busy = false; }
function walkName(p){ return p.carrying ? 'carry' : p.cartObj ? 'push' : p.c.f ? 'walk_f' : 'walk'; }

  if (d < .18){
    p.path.shift();

    return true;
  }

  return true;
}
function arrive(p){

  p.face = faceShelf(p);
  p.browses--;
  if (!p.cartObj && rnd() < .75){ play(p, rnd() < .5 ? 'reach' : 'pick_up', { once: true, fade: .3 }); p.timer = 3.6; p.afterAct = true; }
  else { play(p, pick(['look', 'idle'])); p.timer = 3 + rnd() * 4; }
}
function joinQueue(p){
  const co = CHECKOUTS.slice().sort((a, b) => a.queue.length - b.queue.length)[0];
  if (!co || co.queue.length >= 3){ p.browses = 1; goTo(p, randomSpot()); return; }
  p.role = 'queue'; p.co = co; p.slot = co.queue.length; co.queue.push(p);
  goTo(p, slotPos(co, p.slot), q => { q.inLine = true; q.face = q.slot === 0 ? Math.PI / 2 : 0; play(q, pick(['idle', 'look'])); });
}

  const i = NPCS.indexOf(p); if (i >= 0) NPCS.splice(i, 1);

function updateShopper(p, dt){
  const moving = stepAgent(p, dt);
  if (moving){ const n = walkName(p); play(p, n, { speed: Math.max(.45, Math.min(1.4, p.vel / STRIDE[n])) }); }
  else if (p.face !== undefined){ p.face = nearAngle(p.g.rotation.y, p.face); p.g.rotation.y += (p.face - p.g.rotation.y) * Math.min(1, dt * 3); }
  if (moving || p.role !== 'shopper') return;
  p.timer -= dt;
  if (p.afterAct && p.timer < 1.2){ p.afterAct = false; play(p, pick(['idle', 'look'])); }
  if (p.timer <= 0){
    if (p.browses <= 0) joinQueue(p);
    else goTo(p, randomSpot());
  }

    COLL.push([co.x + .45, co.x + 1.1, co.scanZ - .45, co.scanZ + .4]);
    // customers already waiting when the visitor arrives
    const n = i === 2 ? 1 : 2;
    for (let k = 0; k < n; k++){
      const q = spawnShopper(false); q.role = 'queue'; q.co = co; q.slot = k; co.queue.push(q); q.inLine = true;
      q.pos.copy(slotPos(co, k)); q.g.position.copy(q.pos); q.g.rotation.y = q.face = k === 0 ? Math.PI / 2 : 0; q.path = null;

  // stocker carrying cartons from the trolley to the snacks shelf
  const wk = RIGS.chars.find(c => c.worker) || pool[0];

  const box = new THREE.Mesh(new THREE.BoxGeometry(.42, .26, .3), smat('#B88A55', .9)); box.visible = false; st.g.add(box);
  const trolley = new THREE.Group(); trolley.position.set(-.45, 0, -12.9);
  const tb = new THREE.Mesh(new THREE.BoxGeometry(.55, .03, .9), MAT.dark); tb.position.y = .25; trolley.add(tb);
  const th = new THREE.Mesh(new THREE.BoxGeometry(.55, .9, .03), MAT.steel); th.position.set(0, .7, -.45); trolley.add(th);
  const cardboard = smat('#B88A55', .9);
  for (let k = 0; k < 5; k++){ const bx = new THREE.Mesh(new THREE.BoxGeometry(.4, .25, .3), cardboard); bx.position.set(k % 2 ? .04 : -.04, .4 + Math.floor(k / 2) * .26, k % 2 ? .2 : -.2); bx.rotation.y = (rnd() - .5) * .2; trolley.add(bx); }
  [[.22, .35], [-.22, .35], [.22, -.35], [-.22, -.35]].forEach(([x, z]) => { const w = new THREE.Mesh(new THREE.CylinderGeometry(.05, .05, .03, 12), MAT.kick); w.rotation.z = Math.PI / 2; w.position.set(x, .05, z); trolley.add(w); });
  scene.add(trolley); COLL.push([-1.6, -.15, -13.4, -11.5]);
  st.pos.set(-.98, 0, -12.9); st.g.position.copy(st.pos); st.g.rotation.y = Math.PI / 2;
  STAFF.push({ type: 'stocker', p: st, box, step: 0, t: 0, A: new THREE.Vector3(-.98, 0, -12.9), B: new THREE.Vector3(-1.32, 0, -11.95) });
  play(st, 'pick_up', { once: true });
  // produce assistant tidying the crates
  const pw = makePerson(RIGS.chars.find(c => c.f) || pool[0], { apron: true, height: 1.63 });
  pw.g.position.set(-5.75, 0, 2.6); pw.g.rotation.y = -Math.PI / 2;

}
function setItem(st){
  st.item.clear();
  const p = st.sellable[Math.floor(rnd() * st.sellable.length)];
  partsFor(p, 0).forEach(pt => st.item.add(new THREE.Mesh(pt.g, pt.m)));
  st.item.rotation.set(0, rnd() * 6, 0);
}
function updateCheckout(co, dt){
  const front = co.queue[0];
  if (co.state === 'idle' && front && front.inLine && front.slot === 0 && !front.path){
    co.state = 'scan'; co.items = 4 + Math.floor(rnd() * 8);
    if (front.cartObj) front.cartObj.position.set(0, 0, -.75);
    play(front, 'put_down', { fade: .5 });
  }
  if (co.state === 'pay'){
    co.t -= dt;
    if (co.t <= 0){
      co.state = 'idle'; co.queue.shift();
      front.role = 'leaving'; front.inLine = false; if (front.cartObj) front.cartObj.position.set(0, 0, .6);
      goTo(front, new THREE.Vector3(co.x - .8, 0, co.z0 + 3.0), q => goTo(q, new THREE.Vector3(-1 + rnd() * 2, 0, 5.3), despawn));
      co.queue.forEach((q, k) => { q.slot = k; q.inLine = false; goTo(q, slotPos(co, k), r => { r.inLine = true; r.face = r.slot === 0 ? Math.PI / 2 : 0; play(r, 'idle'); }); });
    }
  }
}
function updateStaff(dt){
  if (!RIGS) return;
  CHECKOUTS.forEach(co => updateCheckout(co, dt));
  for (const st of STAFF){
    const p = st.p; p.mixer.update(dt);
    if (st.type === 'cashier'){
      const co = st.co;
      if (co.state !== 'scan'){ st.item.visible = false; continue; }
      if (!st.item.visible){ setItem(st); st.item.visible = true; st.t = 0; st.beeped = false; st.dur = 1.3 + rnd() * .9; }
      st.t += dt; const k = Math.min(1, st.t / st.dur);
      st.item.position.set(co.x - .05, .92 + Math.sin(k * Math.PI) * .12, co.z0 + .9 + k * 1.05);
      if (!st.beeped && k > .5){ st.beeped = true; beep(st.item.position, rnd() < .2); }
      if (st.t > st.dur + .35){
        co.items--; st.item.visible = false;
        if (co.items <= 0){ co.state = 'pay'; co.t = 3; playAt('register', st.item.position, .8); const f = co.queue[0]; if (f) play(f, 'idle'); }
      }
    } else if (st.type === 'stocker'){
      st.t += dt;
      if (st.step === 0){ if (st.t > 1.7) st.box.visible = true, st.box.position.set(0, 1.0, .34); if (st.t > 3.3){ st.step = 1; st.t = 0; p.carrying = true; p.speed = .9; goTo(p, st.B, () => { st.step = 2; st.t = 0; p.face = -Math.PI / 2; play(p, 'put_down', { once: true, fade: .3 }); }); } }
      else if (st.step === 2){ if (st.t > 2.4) st.box.visible = false; if (st.t > 4.6){ st.step = 3; st.t = 0; p.carrying = false; goTo(p, st.A, () => { st.step = 0; st.t = 0; p.face = Math.PI / 2; play(p, 'pick_up', { once: true, fade: .3 }); }); } }
      const moving = stepAgent(p, dt);
      if (moving){ const n = walkName(p); play(p, n, { speed: Math.max(.5, Math.min(1.3, p.vel / STRIDE[n])) }); }
      else if (p.face !== undefined){ p.face = nearAngle(p.g.rotation.y, p.face); p.g.rotation.y += (p.face - p.g.rotation.y) * Math.min(1, dt * 4); }
      p.g.position.copy(p.pos);
    } else if (st.type === 'produce'){
      st.t -= dt;
      if (st.t <= 0){ const a = pick(['reach', 'pick_up', 'look', 'look']); play(p, a, { once: a !== 'look', fade: .4 }); st.t = a === 'look' ? 5 : 3.6; }
    }
  }
}
function spawnNPCs(){
  loadRigs().then(r => {
    RIGS = r;
    spawnStaff();
    for (let i = 0; i < 8; i++) spawnShopper(false);
    if (AUD.ctx) AUD.refreshCarts && AUD.refreshCarts();
  }).catch(e => console.warn('people not loaded', e));
}
function updateNPCs(dt){
  if (!RIGS) return;
  for (const p of NPCS.slice()){
    const d = Math.hypot(p.pos.x - me.pos.x, p.pos.z - me.pos.z);
    if (p.role === 'queue' || p.role === 'leaving'){
      const moving = stepAgent(p, dt);
      if (moving){ const n = walkName(p); play(p, n, { speed: Math.max(.45, Math.min(1.4, p.vel / STRIDE[n])) }); }
      else if (p.face !== undefined){ p.face = nearAngle(p.g.rotation.y, p.face); p.g.rotation.y += (p.face - p.g.rotation.y) * Math.min(1, dt * 3); }
    } else updateShopper(p, dt);
    // far away people animate at a lower rate to save the phone's battery
    p.skip = d > 18 ? (p.skip || 0) + dt : 0;
    if (d <= 18) p.mixer.update(dt); else if (p.skip > .1){ p.mixer.update(p.skip); p.skip = 0; }
    p.g.position.set(p.pos.x, 0, p.pos.z);
  }
}

/* ---------- store sound: real recordings ---------- */
const AUD = { ctx: null, on: mem.get('bd2_sound', true), buf: {}, carts: new Map() };
const SOUNDS = ['ambience', 'scan_beep', 'cart', 'chime', 'register', 'steps', 'fridge'];
function audioReady(){ return AUD.ctx && AUD.on && AUD.ctx.state === 'running' && !document.hidden; }
async function audioStart(){
  if (!AUD.on) return;
  if (AUD.ctx){ if (AUD.ctx.state === 'suspended') AUD.ctx.resume(); return; }
  const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
  const ctx = AUD.ctx = new AC();
  AUD.master = ctx.createGain(); AUD.master.gain.value = 1; AUD.master.connect(ctx.destination);
  await Promise.all(SOUNDS.map(n => fetch(`sounds/snd_${n}.mp3`).then(r => r.arrayBuffer()).then(b => new Promise((res, rej) => ctx.decodeAudioData(b, res, rej))).then(d => { AUD.buf[n] = d; }).catch(() => {})));
  AUD.amb = loopSrc('ambience', .55);
  AUD.fridge = loopSrc('fridge', 0);
  AUD.steps = loopSrc('steps', 0);
  const pa = () => { playAt('chime', null, .55); AUD.paT = setTimeout(pa, 70000 + Math.random() * 60000); };
  AUD.paT = setTimeout(pa, 15000);
}
function loopSrc(name, gain){
  const b = AUD.buf[name]; if (!b) return null;
  const s = AUD.ctx.createBufferSource(); s.buffer = b; s.loop = true;
  const g = AUD.ctx.createGain(); g.gain.value = gain; const pn = AUD.ctx.createStereoPanner();
  s.connect(g).connect(pn).connect(AUD.master); s.start(0, Math.random() * b.duration);
  return { s, g, pn };
}
function spatial(pos, range){
  const dx = pos.x - me.pos.x, dz = pos.z - me.pos.z, d = Math.hypot(dx, dz);
  const rel = Math.atan2(-dx, -dz) - me.yaw;
  return { vol: Math.pow(Math.max(0, 1 - d / range), 1.4), pan: Math.max(-1, Math.min(1, -Math.sin(rel))) };
}
function playAt(name, pos, vol = 1, range = 20){
  if (!audioReady() || !AUD.buf[name]) return;
  const sp = pos ? spatial(pos, range) : { vol: 1, pan: 0 }; if (sp.vol < .01) return;
  const s = AUD.ctx.createBufferSource(); s.buffer = AUD.buf[name]; s.playbackRate.value = .97 + Math.random() * .06;
  const g = AUD.ctx.createGain(); g.gain.value = vol * sp.vol; const pn = AUD.ctx.createStereoPanner(); pn.pan.value = sp.pan * .8;
  s.connect(g).connect(pn).connect(AUD.master); s.start();
}
// the checkout scanner, sometimes scanned twice
function beep(pos, twice){
  playAt('scan_beep', pos, .9, 18);
  if (twice) setTimeout(() => playAt('scan_beep', pos, .9, 18), 220);
}
function updateAudio(speed){
  if (!AUD.ctx || AUD.ctx.state !== 'running') return;
  const t = AUD.ctx.currentTime;
  if (AUD.fridge) AUD.fridge.g.gain.setTargetAtTime(Math.max(0, 1 - (me.pos.z - Z0) / 8) * .5, t, .3);
  if (AUD.steps){ const m = Math.min(1, speed / 1.4); AUD.steps.g.gain.setTargetAtTime(m * .45, t, .08); AUD.steps.s.playbackRate.setTargetAtTime(.75 + m * .35, t, .1); }
  NPCS.forEach(p => {
    if (!p.cartObj) return;
    let c = AUD.carts.get(p); if (!c){ c = loopSrc('cart', 0); if (!c) return; AUD.carts.set(p, c); }
    const sp = spatial(p.pos, 12), mv = Math.min(1, (p.vel || 0) / .6);
    c.g.gain.setTargetAtTime(sp.vol * mv * .5, t, .1); c.pn.pan.setTargetAtTime(sp.pan * .8, t, .1);
  });
}
function setSound(on){
  AUD.on = on; mem.set('bd2_sound', on);
  $('#soundBtn').setAttribute('aria-pressed', on);
  $('#soundIco').innerHTML = on ? '<path d="M4 9v6h4l5 4V5L8 9z"/><path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/>' : '<path d="M4 9v6h4l5 4V5L8 9z"/><path d="m17 9 5 6M22 9l-5 6"/>';
  if (on) audioStart(); else if (AUD.ctx) AUD.ctx.suspend();
}

let last = performance.now();
function loop(now){
  requestAnimationFrame(loop);
  const dt = Math.min(.05, (now - last) / 1000); last = now;
  if (view !== 'store' || document.hidden) return;
  const fwdV = new THREE.Vector3(-Math.sin(me.yaw), 0, -Math.cos(me.yaw)), rightV = new THREE.Vector3(Math.cos(me.yaw), 0, -Math.sin(me.yaw));
  const want = new THREE.Vector3();
  if (path){
    const tgt = path.pts[path.i];
    const d = Math.hypot(tgt.x - me.pos.x, tgt.z - me.pos.z);
    const last = path.i === path.pts.length - 1;
    if (d < (last ? .08 : .45)){ if (last) finishPath(); else path.i++; }
    else {
      const dir = new THREE.Vector3(tgt.x - me.pos.x, 0, tgt.z - me.pos.z).normalize();
      const sp = path.speed * (last ? Math.min(1, d / 1.1 + .15) : 1);
      want.copy(dir).multiplyScalar(sp);
      if (d > .3) me.tYaw = nearAngle(me.yaw, Math.atan2(-dir.x, -dir.z));
      if (!path.look || path.i < path.pts.length - 1) me.tPitch += (-.06 - me.tPitch) * Math.min(1, dt * 2);
    }
  } else if (!openSheet){
    let f = 0, turn = 0, str = 0;
    if (joy.on){ const jy = -joy.y, jx = joy.x; f = Math.abs(jy) > .12 ? jy : 0; turn = Math.abs(jx) > .15 ? -jx : 0; }
    if (keys.w || keys.arrowup) f += 1;
    if (keys.s || keys.arrowdown) f -= 1;
    if (keys.a) str -= 1;
    if (keys.d) str += 1;
    if (keys.arrowleft) turn += 1;
    if (keys.arrowright) turn -= 1;
    me.tYaw += turn * dt * 1.5;
    const sp = 2.1 * Math.min(1, Math.hypot(f, str));
    if (sp > .01){ want.addScaledVector(fwdV, f).addScaledVector(rightV, str).normalize().multiplyScalar(sp * (f < 0 ? .6 : 1)); }
  }
  me.vel.lerp(want, 1 - Math.exp(-dt * (want.lengthSq() > me.vel.lengthSq() ? 5 : 7)));
  if (me.vel.lengthSq() > 1e-5){ const ok = moveBy(me.vel.x * dt, me.vel.z * dt); if (!ok && path){ path = null; } }
  me.yaw += (me.tYaw - me.yaw) * (1 - Math.exp(-dt * (path ? 6 : 12)));
  me.pitch += (me.tPitch - me.pitch) * (1 - Math.exp(-dt * 12));
  const speed = Math.hypot(me.vel.x, me.vel.z);
  if (!reduceMotion) me.bob += dt * speed * 5.6;
  const bobAmp = reduceMotion ? 0 : Math.min(1, speed / 1.6) * .014;
  camera.position.set(me.pos.x, EYE + Math.sin(me.bob * 2) * bobAmp, me.pos.z);
  camera.rotation.set(me.pitch, me.yaw, Math.sin(me.bob) * bobAmp * .25);
  updateNPCs(dt); updateStaff(dt); updateAudio(speed);
  if (highlight.visible){ const left = hlUntil - now; if (left <= 0) highlight.visible = false; else highlight.material.opacity = .55 + .35 * Math.sin(now / 180); }
  if (marker.visible){ const a = (now - marker.userData.t) / 900; if (a > 1 && !path) marker.visible = false; else { const s = 1 + (a % 1) * .6; marker.scale.set(s, s, s); marker.material.opacity = .8 * (1 - (a % 1)); } }
  renderer.render(scene, camera);
}
function resize(){
  const w = innerWidth, h = innerHeight;
  renderer.setSize(w, h, false);
  // shelves sit below eye level, so the horizon is lifted toward the top of a tall phone screen
  const portrait = w / h < .8, extra = portrait ? .2 : .1, fullH = h * (1 + extra);
  camera.aspect = w / fullH; camera.fov = portrait ? 84 : 64;
  camera.setViewOffset(w, fullH, 0, h * extra, w, h);
  camera.updateProjectionMatrix();
}

/* ---------- boot ---------- */
const nextFrame = () => new Promise(r => requestAnimationFrame(() => setTimeout(r, 0)));
function progress(p, t){ $('#ldBar').style.width = (p * 100) + '%'; if (t) $('#ldTxt').textContent = t; }
async function fontsReady(){
  try { await Promise.race([Promise.all([document.fonts.load('700 20px "Rubik"', 'عربي'), document.fonts.load('500 20px "Rubik"', 'عربي'), document.fonts.load('700 20px "Reem Kufi"', 'عربي'), document.fonts.load('40px "Lalezar"', 'عربي')]), new Promise(r => setTimeout(r, 3000))]); } catch(e){}
}
async function init3D(){
  const cv = $('#gl');

  catch(e){ return false; }
  renderer.setPixelRatio(Math.min(devicePixelRatio || 1, coarse ? 1.5 : 1.75));
  renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.0;
  scene = new THREE.Scene();

  const key = new THREE.DirectionalLight('#FFF4E4', .55); key.position.set(1, 10, 3); scene.add(key);
  [[-4.95, -14], [0, -14], [4.95, -14], [-4.95, -8.5], [0, -8.5], [4.95, -8.5], [-3, -2], [3, -2]].forEach(([x, z]) => {
    const l = new THREE.PointLight('#FFF1DC', z > -3 ? 4 : 7, 9, 1.6); l.position.set(x, CEIL - .7, z); scene.add(l);
  });
  progress(.1, 'بنرتّب الرفوف…'); await nextFrame();

  buildFridges(); buildCheckouts();
  progress(.6, 'بنرتّب الخضرة…'); await nextFrame();
  buildProduce();

  me.yaw = me.tYaw = -.12;
  progress(.85, 'جاهزين تقريباً…'); await nextFrame();
  renderer.compile(scene, camera);

}
let coachShown = false;
function hideCoach(){ if (!coachShown) return; coachShown = false; $('#coach').hidden = true; mem.set('bd2_coach', true); }
async function boot(){
  renderChips(); initDeal(); refreshCart();
  await fontsReady();
  try { gl = await init3D(); } catch(e){ console.error(e); gl = false; }
  setView(gl ? 'store' : 'list');
  progress(1);
  const ld = $('#loader'); ld.classList.add('out'); setTimeout(() => ld.hidden = true, 600);
  if (gl && !mem.get('bd2_coach', false)){
    if (!coarse){ $('#coachZones').hidden = true; $('#coachTxt').innerHTML = '<b>للتنقل:</b> اضغط على الأرض لتمشي لهناك، أو امشِ بأزرار W A S D. اسحب بالماوس لتلتفت، واضغط على أي منتج لتشوف سعره.'; }
    $('#coach').hidden = false; coachShown = true;
  }
  $('#coachOk').addEventListener('click', hideCoach);

  else makeThumbsFallback();
}

boot();
